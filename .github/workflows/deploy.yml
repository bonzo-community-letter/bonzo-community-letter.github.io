name: Deploy to GitHub Pages

# Runs on every merge to main. Requires Settings → Pages → Source: "GitHub Actions"
# (one-time, repo admin) — without it the deploy step fails with "Pages is not enabled".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public by design — these end up in the client bundle. Never a secret.
          VITE_HEDERA_NETWORK: ${{ vars.VITE_HEDERA_NETWORK }}
          VITE_HCS_TOPIC_ID_TESTNET: ${{ vars.VITE_HCS_TOPIC_ID_TESTNET }}
          VITE_HCS_TOPIC_ID_MAINNET: ${{ vars.VITE_HCS_TOPIC_ID_MAINNET }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_CONTACT_URL: ${{ vars.VITE_CONTACT_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
